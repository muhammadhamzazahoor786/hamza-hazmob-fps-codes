<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Search and copy Hazmob FPS chat codes and Alt codes from one easy code library.">
<meta name="keywords" content="Hazmob FPS codes, Hazmob chat codes, copy codes, Alt codes">
<title>Hazmob FPS Code Library</title>
<style>
:root{--bg:#0b1220;--panel:#121e32;--panel2:#192943;--text:#edf4ff;--muted:#9eb0ca;--accent:#36b7a5;--line:#2a3b56}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#08111f,#10243b);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
header{padding:42px 18px 32px;text-align:center;background:linear-gradient(120deg,#102c4b,#123c50);border-bottom:1px solid #31536b}
h1{margin:0;font-size:clamp(27px,5vw,43px);letter-spacing:.5px}header p{color:#c3d6e9;margin:10px 0 0}
.wrap{max-width:1100px;margin:26px auto;padding:0 16px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;box-shadow:0 12px 30px #0003}
input,select{background:#0b1728;color:var(--text);border:1px solid #344966;border-radius:10px;padding:14px;font-size:15px;min-width:0}
.stats{color:var(--muted);font-size:13px;align-self:center;text-align:right}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px;margin-top:18px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0}
.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.itemtop strong{font-size:14px}.tag{font-size:11px;color:#8fe3d7;background:#153d43;padding:5px 8px;border-radius:20px;white-space:nowrap}
pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:#081321;color:#d9f4e9;border:1px solid #24364d;border-radius:9px;padding:12px;margin:0 0 12px;font-size:13px;line-height:1.55;min-height:54px}
button{border:0;border-radius:8px;background:var(--accent);color:#06201d;font-weight:700;padding:10px 14px;cursor:pointer}
button:hover{filter:brightness(1.1)}.pages{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0}.pages button:disabled{opacity:.35;cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:45px 10px;background:var(--panel);border-radius:12px}
footer{text-align:center;color:var(--muted);padding:25px 12px;border-top:1px solid var(--line);font-size:13px}
@media(max-width:650px){.toolbar{grid-template-columns:1fr}.stats{text-align:left}.wrap{margin-top:16px}}
</style>
</head>
<body>
<header>
  <h1>HAZMOB FPS CODE LIBRARY</h1>
  <p>Search • Explore • Copy your favourite codes</p>
</header>
<main class="wrap">
  <section class="toolbar">
    <input id="search" type="search" placeholder="Search by code, number, text or symbol..." aria-label="Search codes">
    <select id="filter" aria-label="Filter code type">
      <option value="All">All Codes</option>
      <option value="Chat Code">Hazmob Chat Codes</option>
      <option value="Alt Code">Alt Codes</option>
    </select>
    <div class="stats" id="stats"></div>
  </section>
  <section id="list" aria-live="polite"></section>
  <nav class="pages">
    <button id="prev">Previous</button>
    <span id="pageInfo"></span>
    <button id="next">Next</button>
  </nav>
</main>
<footer>Hazmob FPS Code Library · Codes are displayed as text for safe copying.</footer>

const PAGE_SIZE = 60;
let page = 1;
const search = document.getElementById('search');
const filter = document.getElementById('filter');
const list = document.getElementById('list');
const stats = document.getElementById('stats');
const pageInfo = document.getElementById('pageInfo');

function filteredCodes(){
  const q = search.value.trim().toLowerCase();
  const type = filter.value;
  return allCodes.filter(item =>
    (type === 'All' || item.type === type) &&
    (!q || (`${item.id} ${item.code} ${item.type}`).toLowerCase().includes(q))
  );
}
function render(){
  const results = filteredCodes();
  const pages = Math.max(1, Math.ceil(results.length/PAGE_SIZE));
  page = Math.min(page,pages);
  const start = (page-1)*PAGE_SIZE;
  const visible = results.slice(start,start+PAGE_SIZE);
  stats.textContent = `${results.length.toLocaleString()} matching codes · ${allCodes.length.toLocaleString()} total`;
  pageInfo.textContent = `Page ${page} of ${pages}`;
  document.getElementById('prev').disabled = page <= 1;
  document.getElementById('next').disabled = page >= pages;
  list.replaceChildren();
  if(!visible.length){
    const empty=document.createElement('div'); empty.className='empty'; empty.textContent='No matching codes found. Try another search.';
    list.appendChild(empty); return;
  }
  visible.forEach(item=>{
    const card=document.createElement('article'); card.className='item';
    const top=document.createElement('div'); top.className='itemtop';
    const title=document.createElement('strong');
    title.textContent = item.type === 'Chat Code' ? `Chat Code #${item.id}` : `Alt Code #${item.id}`;
    const tag=document.createElement('span'); tag.className='tag'; tag.textContent=item.type;
    top.append(title,tag);
    const pre=document.createElement('pre'); pre.textContent=item.code;
    const btn=document.createElement('button'); btn.textContent='Copy Code';
    btn.addEventListener('click',async()=>{
      try{
        await navigator.clipboard.writeText(item.code);
        btn.textContent='Copied!';
        setTimeout(()=>btn.textContent='Copy Code',1200);
      }catch(e){
        const area=document.createElement('textarea'); area.value=item.code; document.body.appendChild(area);
        area.select(); document.execCommand('copy'); area.remove();
        btn.textContent='Copied!'; setTimeout(()=>btn.textContent='Copy Code',1200);
      }
    });
    card.append(top,pre,btn); list.appendChild(card);
  });
}
search.addEventListener('input',()=>{page=1;render()});
filter.addEventListener('change',()=>{page=1;render()});
document.getElementById('prev').addEventListener('click',()=>{page--;render();window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('next').addEventListener('click',()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})});
render();
</script>
